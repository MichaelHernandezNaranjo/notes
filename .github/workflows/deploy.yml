name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runner installed on the server (see deploy/README.md).
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and (re)start the stack
        run: docker compose --env-file /opt/notes/.env up -d --build --remove-orphans

      - name: Show status
        run: docker compose --env-file /opt/notes/.env ps

      - name: Prune old images
        run: docker image prune -f
